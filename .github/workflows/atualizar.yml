name: Atualizar Dados Chikungunya RIDE-DF

on:
  schedule:
    - cron: '0 4 * * *'

  workflow_dispatch:
    inputs:
      anos:
        description: "Reprocessar anos específicos (ex.: 2025 2024). Vazio = rotina normal."
        required: false
        default: ""
      tudo:
        description: "Reconstruir todos os anos desde 2021"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados-chikungunya-main
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atualizar dados (incremental)
        env:
          ANOS: ${{ inputs.anos }}
          TUDO: ${{ inputs.tudo }}
        run: |
          args=()
          [ "$TUDO" = "true" ] && args+=(--tudo)
          [ -n "$ANOS" ] && args+=(--anos $ANOS)
          python atualizar.py "${args[@]}"

      - name: Commit e push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada mudou nesta atualização."
            exit 0
          fi
          git commit -m "Dados chikungunya RIDE-DF ($(date -u +%Y-%m-%d))"
          for tentativa in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((tentativa * 5))
          done
          echo "Não foi possível publicar após três tentativas."
          exit 1
