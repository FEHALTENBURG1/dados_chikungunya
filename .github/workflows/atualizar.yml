name: ETL Epidemiológico Chikungunya

on:
  schedule:
    - cron: '0 4 * * *' # Executa diariamente às 04:00 UTC (01:00 BRT)
  workflow_dispatch: # Permite a execução manual na aba "Actions"

jobs:
  processamento_estatistico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Setup do ambiente R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'

      - name: Instalar bibliotecas de sistema operacional (Dependências espaciais)
        run: sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Instalar pacotes R
        run: |
          install.packages(c("dplyr", "readr", "jsonlite", "lubridate", "spdep", "sf"))
        shell: Rscript {0}

      - name: Executar Pipeline Analítico
        run: Rscript scripts/pipeline_smart.R

      - name: Commit e Push do JSON Consolidado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_processed/painel_chik.json
          git commit -m "🤖 Atualização automática do pipeline epidemiológico" || echo "Nenhuma alteração para comitar."
          git push
